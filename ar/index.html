<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>More Parties DC · Live Logo</title>
<style>
 html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:-apple-system,Helvetica,Arial,sans-serif}
 #ar{position:fixed;inset:0}
 #hint{position:fixed;left:0;right:0;bottom:max(24px,env(safe-area-inset-bottom));text-align:center;color:#fff;font-size:14px;letter-spacing:.12em;text-transform:uppercase;text-shadow:0 1px 4px #000;pointer-events:none;transition:opacity .4s}
 #start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;background:#000;color:#fff;z-index:9}
 #start img{width:70vw;max-width:420px}
 #start button{font:600 15px/1 -apple-system,Helvetica,Arial;letter-spacing:.14em;text-transform:uppercase;background:#e81a39;color:#fff;border:0;border-radius:999px;padding:16px 28px}
 [hidden]{display:none!important}
 #hint{bottom:calc(max(22px,env(safe-area-inset-bottom)) + 150px)}
 #how{position:fixed;left:0;right:0;bottom:calc(max(22px,env(safe-area-inset-bottom)) + 112px);margin:0;text-align:center;color:#fff;font:600 13px/1.2 -apple-system,Helvetica,Arial,sans-serif;text-shadow:0 1px 4px #000;pointer-events:none;z-index:5}
 #cam .b{display:flex;flex-direction:column;align-items:center;gap:7px}
 #cam .b>span{color:#fff;font:700 11px/1 -apple-system,Helvetica,Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;text-shadow:0 1px 3px #000}
 #cam{position:fixed;left:0;right:0;bottom:max(22px,env(safe-area-inset-bottom));display:flex;align-items:flex-start;justify-content:center;gap:34px;z-index:5}
 #cam button{-webkit-tap-highlight-color:transparent;border:0;padding:0;background:none;width:68px;height:68px;border-radius:50%}
 #shot{background:#fff!important;box-shadow:0 0 0 4px rgba(255,255,255,.35),0 2px 10px rgba(0,0,0,.5)}
 #shot:disabled{opacity:.3}

 #rec span{display:block;width:46px;height:46px;border-radius:50%;background:#e81a39;transition:all .15s}
 #rec.on span{width:26px;height:26px;border-radius:6px}
 #clock{position:fixed;top:max(18px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#e81a39;color:#fff;font:600 14px/1 -apple-system,Helvetica,Arial,sans-serif;padding:7px 12px;border-radius:999px;z-index:5}
 #tray{position:fixed;inset:0;background:#000;z-index:8;display:flex;flex-direction:column;align-items:center;gap:14px;box-sizing:border-box;padding:max(16px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom))}
 #view{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
 #view img,#view video{max-width:100%;max-height:100%;border-radius:14px}
 #acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
 #acts button,#acts a{font:600 14px/1 -apple-system,Helvetica,Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:15px 22px;border:0;text-decoration:none;color:#fff;background:#1c1c1f}
 #acts #share{background:#e81a39}
 #tip{color:#9a9aa2;font-size:12px;line-height:1.4;text-align:center;margin:0;max-width:340px}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
</head><body>
<div id="start"><img src="./targets/mpdc_logo_transparent_trim.png" alt="More Parties DC"><button id="go">Point at the logo</button></div>
<div id="ar"></div><div id="hint">Point your camera at the More Parties DC logo</div>
<p id="how" hidden>Take a photo or a video, then share it to your story</p>
<div id="cam" hidden><div class="b"><button id="shot" type="button" aria-label="Take a photo"></button><span>Photo</span></div><div class="b"><button id="rec" type="button" aria-label="Record a video"><span></span></button><span id="reclbl">Video</span></div></div>
<div id="clock" hidden>0:00</div>
<div id="tray" hidden><div id="view"></div><div id="acts"><button id="share" type="button">Share or save</button><a id="save">Save</a><button id="back" type="button">Back to camera</button></div><p id="tip"></p></div>
<script type="module">
import * as THREE from 'three';
import { MindARThree } from './vendor/mindar-image-three.prod.js';

const S = window.__ar = { started: 0, found: 0, foundAt: null, lostCount: 0, framesTracked: 0, frames: 0, t0: 0, target: null };
const Q = new URLSearchParams(location.search);
// One link for everything (11/14, after Juice's phone test: "can we not just do one that is able to pick up on both").
// One entry per image in mpdc_logo_5.mind, in order. aspect = target image h/w; art = share of the target's width the logo
// fills; plate = a colour that covers the print, or null (the print stays and the logo lifts off it: the look that
// worked better on the phone, so it is the default for every surface); tex = the logo that lifts off.
const T_BLACK = 647 / 1256, T_WIDE = 748 / 1512;
const TARGETS = [
  { name: 'logo on black (screens, flyers, banners)', aspect: T_BLACK, art: 1000 / 1256, plate: null, tex: './targets/mpdc_logo_nostars.png' },
  { name: 'red logo on white (the foam cup)', aspect: T_WIDE, art: 1256 / 1512, plate: null, tex: './targets/mpdc_logo_allred_nostars.png' },
  { name: 'tattoo on light skin', aspect: T_WIDE, art: 1256 / 1512, plate: null, tex: './targets/mpdc_logo_nostars.png' },
  { name: 'tattoo on medium skin', aspect: T_WIDE, art: 1256 / 1512, plate: null, tex: './targets/mpdc_logo_nostars.png' },
  { name: 'tattoo on deep skin', aspect: T_WIDE, art: 1256 / 1512, plate: null, tex: './targets/mpdc_logo_nostars.png' },
];
const MIND = Q.get('target') || './targets/mpdc_logo_5.mind';   // ?set=tattoo (the old second link) lands here too
// star centres on the print, as fractions of the logo art box (measured from the logo file)
const STAR_UV = [[0.488, -0.391], [0.718, -0.156], [0.946, -0.093]];


// PHOTO AND VIDEO (Juice 2026-11-16: "Yes, add them", so people can post without screen recording).
// A photo or a clip of exactly what this screen shows: the camera picture with the live logo over it, no browser bar.
// Nothing is uploaded. The file is made on the phone and handed to the phone's own share sheet (save it, or post it).
// Video has no sound: asking for the microphone on top of the camera can interrupt the camera on an iPhone.
function setupCapture(mind, renderer) {
  const el = id => document.getElementById(id);
  const cam = el('cam'), shot = el('shot'), rec = el('rec'), clockEl = el('clock'), tray = el('tray'), view = el('view'),
        share = el('share'), save = el('save'), back = el('back'), tip = el('tip'), box = el('ar');
  const video = mind.video, layer = renderer.domElement;
  const out = document.createElement('canvas'), g = out.getContext('2d');
  const MAX_SECONDS = 30;
  const MIME = ['video/mp4;codecs=avc1.42E01E', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm']
    .find(m => window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || null;
  const canRecord = !!(MIME && out.captureStream);
  let wantPhoto = false, recorder = null, chunks = [], startedAt = 0, timer = null, file = null, url = null;

  // the screen's own shape, 1280 at most on the long side, even numbers for the video encoder
  function size() {
    const r = box.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 3);
    const k = Math.min(1, 1280 / (Math.max(r.width, r.height) * dpr));
    const w = Math.max(2, Math.round(r.width * dpr * k / 2) * 2), h = Math.max(2, Math.round(r.height * dpr * k / 2) * 2);
    if (out.width !== w || out.height !== h) { out.width = w; out.height = h; }
  }
  // Camera picture first, cropped the way the screen crops it, then the logo layer over it. Called straight after the
  // 3D frame is drawn, while that layer can still be read.
  function compose() {
    const r = box.getBoundingClientRect(), v = video.getBoundingClientRect(), c = layer.getBoundingClientRect();
    if (!r.width || !v.width || !video.videoWidth) return false;
    g.drawImage(video, (r.left - v.left) / v.width * video.videoWidth, (r.top - v.top) / v.height * video.videoHeight,
      r.width / v.width * video.videoWidth, r.height / v.height * video.videoHeight, 0, 0, out.width, out.height);
    g.drawImage(layer, (c.left - r.left) / r.width * out.width, (c.top - r.top) / r.height * out.height,
      c.width / r.width * out.width, c.height / r.height * out.height);
    return true;
  }
  function afterRender() {
    if (!wantPhoto && !recorder) return;
    if (!recorder) size();                       // the size stays put while a clip is being recorded
    if (!compose()) return;
    if (wantPhoto) {
      wantPhoto = false;
      out.toBlob(b => { if (b) show(new File([b], 'more-parties-dc.jpg', { type: 'image/jpeg' })); }, 'image/jpeg', 0.92);
    }
  }
  function tick() {
    const s = Math.floor((performance.now() - startedAt) / 1000);
    clockEl.textContent = '0:' + String(s).padStart(2, '0');
    if (s >= MAX_SECONDS) stopRec();
  }
  function startRec() {
    size(); chunks = [];
    const stream = out.captureStream(30);
    let r;
    try { r = new MediaRecorder(stream, { mimeType: MIME, videoBitsPerSecond: 6000000 }); }
    catch (e) { stream.getTracks().forEach(t => t.stop()); rec.hidden = true; S.recError = String(e); return; }
    r.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    r.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      recorder = null;
      const type = MIME.split(';')[0], blob = new Blob(chunks, { type });
      if (blob.size) show(new File([blob], 'more-parties-dc.' + (type === 'video/mp4' ? 'mp4' : 'webm'), { type }));
    };
    recorder = r; r.start();
    startedAt = performance.now(); clockEl.textContent = '0:00'; clockEl.hidden = false;
    rec.classList.add('on'); rec.setAttribute('aria-label', 'Stop recording'); shot.disabled = true; el('reclbl').textContent = 'Stop';
    timer = setInterval(tick, 200);
  }
  function stopRec() {
    clearInterval(timer); clockEl.hidden = true;
    rec.classList.remove('on'); rec.setAttribute('aria-label', 'Record a video'); shot.disabled = false; el('reclbl').textContent = 'Video';
    if (recorder && recorder.state !== 'inactive') recorder.stop();
  }
  function show(f) {
    file = f; url = URL.createObjectURL(f);
    view.textContent = '';
    let m;
    if (f.type.indexOf('video') === 0) {
      m = document.createElement('video'); m.muted = true; m.loop = true; m.autoplay = true; m.playsInline = true;
      m.setAttribute('playsinline', ''); m.setAttribute('muted', ''); m.src = url;
    } else { m = new Image(); m.alt = 'Your photo'; m.src = url; }
    view.appendChild(m);
    let sheet = false;
    try { sheet = !!(navigator.canShare && navigator.canShare({ files: [f] })); } catch (e) { sheet = false; }
    share.hidden = !sheet;
    save.href = url; save.setAttribute('download', f.name); save.textContent = sheet ? 'Download' : 'Save';
    tip.textContent = sheet
      ? 'Share or save opens your phone’s share sheet. Save it to your photos, or send it straight to your story.'
      : 'Save puts the file in your downloads.';
    tray.hidden = false;
    S.captures = (S.captures || 0) + 1; S.last = { type: f.type, bytes: f.size, w: out.width, h: out.height, sheet };
  }
  share.onclick = async () => { try { await navigator.share({ files: [file] }); } catch (e) { /* the sheet was closed */ } };
  back.onclick = () => { tray.hidden = true; view.textContent = ''; if (url) URL.revokeObjectURL(url); url = null; file = null; };
  shot.onclick = () => { if (!recorder) wantPhoto = true; };
  rec.onclick = () => (recorder ? stopRec() : startRec());
  if (!canRecord) { rec.parentNode.hidden = true; el('how').textContent = 'Take a photo, then share it to your story'; }   // an older phone browser: photo only
  cam.hidden = false; el('how').hidden = false;
  S.canRecord = canRecord; S.mime = MIME; S.out = out;
  return { afterRender };
}

async function start() {
  document.getElementById('start').remove();
  const mind = new MindARThree({ container: document.getElementById('ar'), imageTargetSrc: MIND, maxTrack: 1,
    uiScanning: 'no', uiLoading: 'no', filterMinCF: 0.0001, filterBeta: 0.001, warmupTolerance: 3, missTolerance: 8 });
  const { renderer, scene, camera } = mind;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  scene.add(new THREE.AmbientLight(0xffffff, 1.2)); const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(.5, .8, 1); scene.add(key);
  const clock = new THREE.Clock(), hint = document.getElementById('hint');

  const glowTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
    const r = g.createRadialGradient(64,64,0,64,64,64); r.addColorStop(0,'rgba(232,26,57,0.9)'); r.addColorStop(1,'rgba(232,26,57,0)');
    g.fillStyle = r; g.fillRect(0,0,128,128); return new THREE.CanvasTexture(c); })();
  const starShape = new THREE.Shape(); for (let i = 0; i < 10; i++) { const a = Math.PI/2 + i*Math.PI/5, r = i%2 ? 0.4 : 1; const x = Math.cos(a)*r, y = Math.sin(a)*r; i ? starShape.lineTo(x,y) : starShape.moveTo(x,y); }
  const starGeo = new THREE.ExtrudeGeometry(starShape, { depth: 0.25, bevelEnabled: true, bevelThickness: .08, bevelSize: .06, bevelSegments: 2 }); starGeo.center();
  const starMat = new THREE.MeshStandardMaterial({ color: 0xe81a39, emissive: 0x5a0010, metalness: .35, roughness: .3 });

  const live = await Promise.all(TARGETS.map(async (cfg, index) => {
    const anchor = mind.addAnchor(index), root = new THREE.Group(); anchor.group.add(root);
    const tex = await new THREE.TextureLoader().loadAsync(cfg.tex); tex.colorSpace = THREE.SRGBColorSpace;
    const lw = cfg.art, lh = lw * tex.image.height / tex.image.width, onWhite = cfg.plate === 0xffffff, noPlate = cfg.plate === null;
    // 0) a plate in the print's own background colour covers the printed logo, so the live one lifts off a clean surface
    const plate = new THREE.Mesh(new THREE.PlaneGeometry(onWhite ? lw * 1.06 : 1.02, onWhite ? lh * 1.3 : cfg.aspect * 1.04), new THREE.MeshBasicMaterial({ color: cfg.plate ?? 0x000000, transparent: true, opacity: 0, depthWrite: false }));
    if (!noPlate) root.add(plate);
    // 1) the logo lifts off the print and rides a wave, with a light sweep
    const U = { uTex: { value: tex }, uT: { value: 0 }, uLift: { value: 0 }, uGlow: { value: 0 } };
    const logo = new THREE.Mesh(new THREE.PlaneGeometry(lw, lh, 64, 16), new THREE.ShaderMaterial({ uniforms: U, transparent: true, depthWrite: false,
      vertexShader: `uniform float uT,uLift; varying vec2 vUv; void main(){ vUv=uv; vec3 p=position;
        p.z += uLift*(0.06 + 0.035*sin(uT*3.0 - uv.x*7.0)); p.y += uLift*0.012*sin(uT*2.0 - uv.x*5.0);
        gl_Position = projectionMatrix*modelViewMatrix*vec4(p,1.0); }`,
      fragmentShader: `uniform sampler2D uTex; uniform float uGlow,uT; varying vec2 vUv; void main(){
        vec4 c = texture2D(uTex, vUv); float sweep = smoothstep(0.08,0.0,abs(vUv.x - fract(uT*0.35)*1.4 + 0.2));
        c.rgb += (uGlow*0.25 + sweep*0.55) * c.a; gl_FragColor = c; }` }));
    // thick lettering, like the 2024 filter's 3D text: the same logo stacked 12 deep behind the front face, darker toward
    // the back. All of it sits in one group (pop) that scales up and spins clockwise in its own plane.
    const pop = new THREE.Group(); root.add(pop); pop.add(logo);
    const sideMat = new THREE.ShaderMaterial({ uniforms: { uTex: U.uTex, uT: U.uT, uLift: U.uLift, uShade: { value: .5 } }, transparent: true, depthWrite: false,
      vertexShader: logo.material.vertexShader, fragmentShader: `uniform sampler2D uTex; uniform float uShade; varying vec2 vUv; void main(){ vec4 c = texture2D(uTex, vUv); c.rgb *= uShade; gl_FragColor = c; }` });
    const layers = []; for (let i = 1; i <= 12; i++) { const m = new THREE.Mesh(logo.geometry, sideMat); m.position.z = -i * 0.0045; m.renderOrder = -i; pop.add(m); layers.push(m); }
    logo.renderOrder = 1;
    // 2) soft red glow behind the logo (additive on dark prints; a faint tint on the white cup)
    const glow = new THREE.Mesh(new THREE.PlaneGeometry(lw * 1.25, lh * 1.9), new THREE.MeshBasicMaterial({ map: glowTex, transparent: true, blending: onWhite ? THREE.NormalBlending : THREE.AdditiveBlending, depthWrite: false, opacity: 0 }));
    glow.position.z = 0.01; root.add(glow);
    // 3) the three stars break free, spin and float
    const stars = STAR_UV.map(([u, v]) => { const m = new THREE.Mesh(starGeo, starMat), x = (u - .5) * lw, y = v * lh; m.scale.setScalar(0.038 * lw / 0.8); m.position.set(x, y, 0.02); root.add(m); return { m, x, y }; });
    // 4) confetti burst on every find (red + white on dark, red + deep red on the white cup)
    const N = 260, pos = new Float32Array(N*3), vel = [], col = new Float32Array(N*3);
    for (let i = 0; i < N; i++) { const red = Math.random() < .6; col.set(red ? [0.91,0.1,0.22] : (onWhite ? [0.55,0.02,0.1] : [1,1,1]), i*3); vel.push(new THREE.Vector3()); }
    const conf = new THREE.Points(new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(pos,3)).setAttribute('color', new THREE.BufferAttribute(col,3)),
      new THREE.PointsMaterial({ size: 0.018, vertexColors: true, transparent: true, depthWrite: false }));
    root.add(conf);
    const RAIN = 46, rain = []; for (let i = 0; i < RAIN; i++) { const m = new THREE.Mesh(starGeo, starMat); m.scale.setScalar(0.016 + Math.random() * 0.016); root.add(m);
      rain.push({ m, x: (Math.random() - .5) * 2.6, z: .1 + Math.random() * .5, ph: Math.random(), sp: .22 + Math.random() * .25, rot: Math.random() * 6 }); }
    const st = { visible: false, shownAt: 0, burstAt: -9, spinAt: -9 };
    const spin = t => { st.spinAt = t; burst(t); };
    const burst = t => { st.burstAt = t; for (let i = 0; i < N; i++) { pos.set([(Math.random()-.5)*lw*.8, (Math.random()-.5)*lh*.4, .05], i*3); vel[i].set((Math.random()-.5)*.9, Math.random()*.9+.2, Math.random()*.8+.3); } };
    anchor.onTargetFound = () => { st.visible = true; S.found++; S.target = index; if (S.foundAt === null) S.foundAt = performance.now() - S.t0; const t = clock.getElapsedTime(); st.shownAt = t; spin(t + 0.45); hint.style.opacity = 0; };
    anchor.onTargetLost = () => { st.visible = false; S.lostCount++; hint.style.opacity = 1; };
    return { st, spin, frame(t) {
      const k = Math.min(1, (t - st.shownAt) / 0.8), e = 1 - Math.pow(1 - k, 3), v = st.visible;
      U.uT.value = t; U.uLift.value = v ? e : 0; U.uGlow.value = .5 + .5*Math.sin(t*4);
      // pop out, then spin clockwise fast (two turns, like spinner rims), easing to a stop; it spins again every 6 s and on a tap
      if (v && t - st.spinAt > 6) st.spinAt = t;
      const sp = Math.min(1, Math.max(0, (t - st.spinAt) / 1.5)), turn = v ? -2 * 6.2832 * (1 - Math.pow(1 - sp, 3)) : 0;
      pop.rotation.z = turn; pop.scale.setScalar(v ? 1 + .28 * e + .1 * Math.sin(Math.PI * sp) : 1); pop.position.z = v ? .05 * e : 0;
      for (const r of rain) { const yy = 1.1 - ((t * r.sp + r.ph) % 1) * 2.2; r.m.visible = v; r.m.position.set(r.x, yy, r.z); r.m.rotation.set(0, t * 2 + r.rot, t * 1.3 + r.rot); }
      glow.material.opacity = v ? e * (onWhite ? .22 : .55 + .2*Math.sin(t*4)) : 0;
      plate.material.opacity = v ? Math.min(1, k * 2.5) * 0.96 : 0;
      stars.forEach((s, i) => { const lift = e * (0.12 + 0.05*Math.sin(t*1.6 + i*2));
        s.m.position.set(s.x + e*0.03*Math.sin(t + i), s.y + lift, 0.03 + e*(0.15 + i*0.04)); s.m.rotation.y = t*(1.5 + i*.4); s.m.rotation.z = Math.sin(t+i)*.3; });
      const dt = t - st.burstAt; conf.visible = v && dt < 3; conf.material.opacity = Math.max(0, 1 - dt/3);
      if (conf.visible) { for (let i = 0; i < N; i++) { const w = vel[i]; pos[i*3] += w.x*.016; pos[i*3+1] += (w.y - dt*.9)*.016; pos[i*3+2] += w.z*.016; } conf.geometry.attributes.position.needsUpdate = true; }
    } };
  }));

  S.t0 = performance.now();
  try { await mind.start(); } catch (e) { hint.textContent = 'Camera is blocked. Allow camera access for this page, then reload.'; hint.style.opacity = 1; S.error = String(e); return; }
  S.started = 1;
  const capture = setupCapture(mind, renderer);
  addEventListener('pointerdown', (e) => { if (e.target && e.target.closest && e.target.closest('#cam,#tray')) return;   // a tap on a button is not a tap on the logo
    const t = clock.getElapsedTime(); for (const l of live) if (l.st.visible) l.spin(t); });
  renderer.setAnimationLoop(() => { const t = clock.getElapsedTime(); S.frames++; if (live.some(l => l.st.visible)) S.framesTracked++; for (const l of live) l.frame(t); renderer.render(scene, camera); capture.afterRender(); });
}
document.getElementById('go').onclick = start;
if (Q.has('autostart')) start();
</script>
